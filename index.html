<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>パチンコシミュレーター（最恐1/399）</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&text=%E6%89%8B%E8%90%BD%E4%B8%8B&display=swap">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="app">

    <div id="title-bar">最恐1/399 シミュレーター</div>

    <div id="header">

      <div class="hrow hrow1">
        <div class="spins-block">
          <span class="spins-current" id="current-spins">0</span>
          <span class="spins-unit">回</span>
          <span class="spins-sep">／累計</span>
          <span class="spins-total" id="total-spins-disp">0</span>
          <span class="spins-unit">回</span>
        </div>
        <div id="mode-badge">通常時</div>
        <div class="esup-block">
          <div class="esup-label" id="esup-label">残り</div>
          <div class="esup-value" id="rush-count">－</div>
        </div>
      </div>

      <div class="hrow hrow2">
        <div class="money-block">
          <span class="money-label">収支</span>
          <span class="money-value red" id="shuushi-value">0</span>
          <span class="money-unit">円</span>
        </div>
        <button class="btn-details-toggle" id="details-toggle" onclick="handleToggleDetails()">詳細▾</button>
      </div>

      <div class="hrow hrow2-detail" id="hrow2-detail" style="display:none;">
        <div class="money-block">
          <span class="money-label">持ち球</span>
          <span class="money-value gold" id="mochi-dama">0</span>
          <span class="money-unit">球</span>
        </div>
        <div class="money-block">
          <span class="money-label">投資</span>
          <span class="money-value red" id="toushi-value">0</span>
          <span class="money-unit">円</span>
        </div>
      </div>

      <div class="hrow hrow3">
        <div class="hrow3-header">
          <span class="hrow3-title">大当たり総回数</span>
          <span class="total-hit-block">
            <span class="total-hit-count" id="total-hit-count">0回</span>
          </span>
        </div>
        <div class="hrow3-stats">
          <div class="hit-item">
            <span class="hit-label2">通常時初当たり</span>
            <span class="hit-count" id="normal-first-hit">0回</span>
            <span class="hit-prob" id="normal-first-prob">1/―</span>
          </div>
          <div class="hit-item">
            <span class="hit-label2">貞子覚醒BURST突入</span>
            <span class="hit-count" id="rush-entry-count">0回</span>
            <span class="rush-entry" id="rush-entry-info">(突入率 0%)</span>
            <span class="rush-entry-theory">理論 約50%</span>
          </div>
        </div>
      </div>

    </div><!-- /header -->

    <div id="main-screen"></div>

    <div id="rush-stats-bar">
      <div class="rsb-header">
        <span class="rsb-title">通算貞子覚醒BURST成績</span>
        <span class="rsb-item">
          <span class="rsb-label">大当たり</span>
          <span class="rsb-val" id="rs-chain">0回</span>
          <span class="rsb-prob" id="rs-prob">1/―</span>
        </span>
        <span class="rsb-item">
          <span class="rsb-label">総回転</span>
          <span class="rsb-val" id="rs-spins">0回</span>
        </span>
        <span class="rsb-item">
          <span class="rsb-label">BIG</span>
          <span class="rsb-val" id="rs-big">0回</span>
        </span>
      </div>
    </div>

    <div id="log-area">
      <div id="log-title">履歴</div>
      <div id="log-list"></div>
    </div>

    <!-- 大当たり履歴グラフ：1ブロック=100回転、700回転以上は▲。左が新しく、横スクロールで過去へ -->
    <div id="hist-area">
      <div class="hist-title"><span>大当たり履歴（1ブロック=100回転）</span><span>← 新しい ｜ 過去 →</span></div>
      <div class="hist-body">
        <div class="hist-axis"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span></div>
        <div class="hist-scroll"><div class="hist-cols" id="hist-cols"></div></div>
      </div>
    </div>

    <!-- 差玉推移グラフ：横軸=総回転数、縦軸=差玉（持ち玉−投資玉） -->
    <div id="slump-area">
      <div class="slump-title"><span>差玉推移（通常時の回転数・4円/玉で換算）</span><span id="slump-now"></span></div>
      <svg id="slump-svg" viewBox="0 0 360 170" preserveAspectRatio="none"></svg>
    </div>

  </div>

  <script src="logic.js?v=1"></script>
  <script src="script.js?v=2"></script>
  <script src="https://wwi195.github.io/site-analytics/tracker.js?v=1" data-site-id="pachinko-simulator-ring"></script>
</body>
</html>
